services:
  api:
    build:
      context: ../..
      dockerfile: deploy/community/Dockerfile
    env_file:
      - ../../server/.env.production
    volumes:
      - gym_buddy_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    env_file:
      - ../../server/.env.production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  gym_buddy_data:
  caddy_data:
  caddy_config:
